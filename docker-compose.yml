version: '3.9'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: employee_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend

    container_name: employee-backend

    restart: always

    ports:
      - "5000:5000"

    depends_on:
      - mysql

    env_file:
      - ./backend/.env

volumes:
  mysql-data: